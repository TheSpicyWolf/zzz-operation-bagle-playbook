<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1487" height="1290" viewBox="0 0 1487 1290"><title>BLUEPRINTS · Four technical chests</title><desc>Look for white-gray weapon boxes at these four locations.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1487" height="1290" fill="#111722"/><text x="30" y="42" font-size="29" font-weight="800" fill="#edff69">BLUEPRINTS · Four technical chests</text><text x="30" y="76" font-size="20" fill="#e2e6ed">Look for white-gray weapon boxes at these four locations.</text><g transform="translate(0 95)"><image x="0" y="0" width="1487" height="1062" xlink:href="../map-background.png"/><path d="M 1057 73 l 21 21 -21 21 -21 -21 Z" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="1057" y="100" text-anchor="middle" font-size="17" font-weight="800" fill="#10151e">1</text><path d="M 209 219 l 21 21 -21 21 -21 -21 Z" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="209" y="246" text-anchor="middle" font-size="17" font-weight="800" fill="#10151e">2</text><path d="M 746 679 l 21 21 -21 21 -21 -21 Z" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="746" y="706" text-anchor="middle" font-size="17" font-weight="800" fill="#10151e">3</text><path d="M 1318 900 l 21 21 -21 21 -21 -21 Z" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="1318" y="927" text-anchor="middle" font-size="17" font-weight="800" fill="#10151e">4</text></g><line x1="25" x2="1462" y1="1177" y2="1177" stroke="#414b59"/><text x="30" y="1210" font-size="20" fill="#e2e6ed">Look for 3 hidden items, or 4 when the chest is inside a corrupted zone.</text><text x="30" y="1240" font-size="20" fill="#e2e6ed">Blueprint farming starts on Hard difficulty; purple gear is enough for the approach described here.</text></svg>