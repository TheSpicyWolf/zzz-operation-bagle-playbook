<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1487" height="1290" viewBox="0 0 1487 1290"><title>СТАРТ · Центральная точка появления</title><desc>Отмечена стартовая зона для этого примера маршрута.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1487" height="1290" fill="#111722"/><text x="30" y="42" font-size="29" font-weight="800" fill="#edff69">СТАРТ · Центральная точка появления</text><text x="30" y="76" font-size="20" fill="#e2e6ed">Отмечена стартовая зона для этого примера маршрута.</text><g transform="translate(0 95)"><image x="0" y="0" width="1487" height="1062" xlink:href="../map-background.png"/><ellipse cx="815" cy="296" rx="238" ry="250" fill="#58b8ff" fill-opacity=".09" stroke="#111722" stroke-width="9"/><ellipse cx="815" cy="296" rx="238" ry="250" fill="none" stroke="#58b8ff" stroke-width="4" stroke-dasharray="14 9"/><g transform="translate(460 552)"><rect width="220" height="36" rx="6" fill="#101722" stroke="#58b8ff" stroke-width="2"/><text x="12" y="25" font-size="19" font-weight="700" fill="#58b8ff">СТАРТОВАЯ ЗОНА</text></g></g><line x1="25" x2="1462" y1="1177" y2="1177" stroke="#414b59"/><text x="30" y="1210" font-size="20" fill="#e2e6ed">В этой стартовой зоне нет дополнительных запертых сундуков вне комнат с ключ-картами.</text><text x="30" y="1240" font-size="20" fill="#e2e6ed">Здесь показан центральный старт. Для «Бахамута» действует исключение, описанное в руководстве.</text></svg>