<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1487" height="1290" viewBox="0 0 1487 1290"><title>ПРИОРИТЕТНЫЕ БОССЫ · Успейте до заражения</title><desc>Эти четыре босса превращаются в маленьких Гончих после заражения их зоны.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1487" height="1290" fill="#111722"/><text x="30" y="42" font-size="29" font-weight="800" fill="#edff69">ПРИОРИТЕТНЫЕ БОССЫ · Успейте до заражения</text><text x="30" y="76" font-size="20" fill="#e2e6ed">Эти четыре босса превращаются в маленьких Гончих после заражения их зоны.</text><g transform="translate(0 95)"><image x="0" y="0" width="1487" height="1062" xlink:href="../map-background.png"/><circle cx="981" cy="73" r="23" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="981" y="79" text-anchor="middle" font-size="18" font-weight="800" fill="#10151e">1</text><circle cx="1327" cy="222" r="23" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="1327" y="228" text-anchor="middle" font-size="18" font-weight="800" fill="#10151e">2</text><circle cx="398" cy="390" r="23" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="398" y="396" text-anchor="middle" font-size="18" font-weight="800" fill="#10151e">3</text><circle cx="714" cy="717" r="23" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="714" y="723" text-anchor="middle" font-size="18" font-weight="800" fill="#10151e">4</text></g><line x1="25" x2="1462" y1="1177" y2="1177" stroke="#414b59"/><text x="30" y="1210" font-size="20" fill="#e2e6ed">1–2: вверху справа    •    3: заправка / вверху слева    •    4: пляж</text><text x="30" y="1240" font-size="20" fill="#e2e6ed">Убейте боссов в зоне первой волны, пока таймер не опустился ниже 20:00.</text></svg>