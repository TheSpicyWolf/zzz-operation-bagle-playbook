<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1487" height="1290" viewBox="0 0 1487 1290"><title>ЧЕРТЕЖИ · Четыре технических сундука</title><desc>Ищите бело-серые ящики с оружием в этих четырёх точках.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1487" height="1290" fill="#111722"/><text x="30" y="42" font-size="29" font-weight="800" fill="#edff69">ЧЕРТЕЖИ · Четыре технических сундука</text><text x="30" y="76" font-size="20" fill="#e2e6ed">Ищите бело-серые ящики с оружием в этих четырёх точках.</text><g transform="translate(0 95)"><image x="0" y="0" width="1487" height="1062" xlink:href="../map-background.png"/><path d="M 1057 73 l 21 21 -21 21 -21 -21 Z" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="1057" y="100" text-anchor="middle" font-size="17" font-weight="800" fill="#10151e">1</text><path d="M 209 219 l 21 21 -21 21 -21 -21 Z" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="209" y="246" text-anchor="middle" font-size="17" font-weight="800" fill="#10151e">2</text><path d="M 746 679 l 21 21 -21 21 -21 -21 Z" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="746" y="706" text-anchor="middle" font-size="17" font-weight="800" fill="#10151e">3</text><path d="M 1318 900 l 21 21 -21 21 -21 -21 Z" fill="#df83fb" stroke="#111722" stroke-width="4"/><text x="1318" y="927" text-anchor="middle" font-size="17" font-weight="800" fill="#10151e">4</text></g><line x1="25" x2="1462" y1="1177" y2="1177" stroke="#414b59"/><text x="30" y="1210" font-size="20" fill="#e2e6ed">Ищите 3 скрытых предмета или 4, если сундук находится в заражённой зоне.</text><text x="30" y="1240" font-size="20" fill="#e2e6ed">Фарм чертежей доступен с высокой сложности (Hard). Для этого способа хватит фиолетового снаряжения.</text></svg>